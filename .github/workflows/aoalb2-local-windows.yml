# aoALB 2 ローカル版：Windowsで自動検証・性能計測（WebView2を含むアプリ全体のメモリ）を行い、
# 未署名インストーラーを Actions Artifact としてだけ保存する。
#
# 影響範囲の限定：
# - 動くのはaoALB2検証ブランチへのpushだけ（main・タグ・Pull Request・スケジュールでは動かない）
# - 権限は contents: read のみ。Release作成・GitHub Pages・mainへの書込み・タグ作成はしない
# - secrets（Supabase等の鍵を含む）は一切参照しない。外部サービスへは接続しない
# - 外部のActionはコミットSHAで固定
#
# 再現性：
# - Rust・Node・Tauri CLI は版を完全に固定（Linuxで検証済みの版）
# - cargo は --locked（Cargo.lock の版から変えない）
# - 使った版・Windows・WebView2 の版と計測条件を environment.json として Artifact に残す
#
# 成果物の合否分離：
# - 利用者が試すインストーラーは全工程が合格した時だけ「aoalb2-windows-installer-passed」として保存
# - 失敗時は「aoalb2-windows-diagnostics-FAILED」（インストーラーは含めない）にログ・計測途中結果を保存
name: aoALB2 local - Windows build

on:
  push:
    branches: [feature/aoalb2-local, feature/aoalb2-folder-classification]
    paths: ["aoalb2-local/**", ".github/workflows/aoalb2-local-windows.yml"]

permissions:
  contents: read

concurrency:
  group: aoalb2-local-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.97.0"
  NODE_VERSION: "22.23.5"
  TAURI_CLI_VERSION: "2.12.6"
  BENCH_PHOTOS: "3000"
  CARGO_TERM_COLOR: never

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        working-directory: aoalb2-local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master（toolchain で版を固定）
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: aoalb2-local

      - name: 書式の確認（cargo fmt）
        run: cargo fmt --check
      - name: 静的検査（clippy）
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: 中核の自動検証
        run: cargo test --locked -p aoalb_core --release
      - name: 画面JSの構文確認（全ファイル）
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "jscheck"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $files = Get-ChildItem app/ui/js -Filter *.js
          if ($files.Count -eq 0) { throw "app/ui/js に JS がありません" }
          foreach ($f in $files) {
            # ES modules として確認するため .mjs として写してから node --check
            $m = Join-Path $dir ($f.BaseName + ".mjs")
            Copy-Item $f.FullName $m
            node --check $m
            if ($LASTEXITCODE -ne 0) { throw "構文エラー：$($f.Name)" }
          }
          Write-Output "構文確認：$($files.Count) ファイル"
      - name: 画面ロジックの自動検証（16件以上）
        shell: pwsh
        run: |
          node --test --test-reporter=tap app/tests/ledger-model.test.mjs app/tests/leave-guard.test.mjs app/tests/folder-classification.test.mjs | Tee-Object -FilePath node-tests.tap
          if ($LASTEXITCODE -ne 0) { throw "Nodeテストが失敗しました" }
          $pass = (Select-String -Path node-tests.tap -Pattern '^# pass (\d+)').Matches.Groups[1].Value
          if ([int]$pass -lt 16) { throw "Nodeテストの件数が不足しています（$pass 件）" }

      - name: 性能計測（3,000枚、計測用工事を残す）
        shell: pwsh
        run: |
          $env:BENCH_KEEP = "1"
          cargo run --locked --release -p aoalb_core --bin aoalb-bench -- $env:BENCH_PHOTOS "$env:RUNNER_TEMP\bench" | Out-File -Encoding utf8 bench-windows.json

      - name: Tauri CLI（版を固定）
        run: cargo install tauri-cli --version "=${{ env.TAURI_CLI_VERSION }}" --locked
      - name: インストーラー作成（未署名・更新機能なし）
        working-directory: aoalb2-local/app/src-tauri
        run: cargo tauri build --bundles nsis -- --locked

      - name: アプリ全体のメモリ計測（WebView2を含む）
        shell: pwsh
        run: |
          pwsh scripts/measure-app-memory.ps1 -App "target\release\aoalb2-app.exe" -Project "$env:RUNNER_TEMP\bench\data\性能計測工事" -Out "measure-windows"

      - name: 使った版と計測条件を記録
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path measure-windows | Out-Null
          $wv2 = $null
          foreach ($k in @("HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}", "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}")) {
            if (Test-Path $k) { $wv2 = (Get-ItemProperty $k).pv; break }
          }
          $os = Get-CimInstance Win32_OperatingSystem
          $cs = Get-CimInstance Win32_ComputerSystem
          [ordered]@{
            commit = "$env:GITHUB_SHA"
            runner = "$env:ImageOS $env:ImageVersion"
            windows = "$($os.Caption) $($os.Version)"
            memoryGB = [math]::Round($cs.TotalPhysicalMemory / 1GB, 1)
            logicalProcessors = $cs.NumberOfLogicalProcessors
            rustc = (rustc --version)
            cargo = (cargo --version)
            node = (node --version)
            tauriCli = (cargo tauri --version 2>$null)
            webview2Runtime = $wv2
            benchPhotos = "$env:BENCH_PHOTOS"
            benchPhotoKind = "架空JPEG（一般 4000x3000 約0.57MB×70%、aoPIC 1280x960×30%）"
            memoryScenario = "工事を開く→写真一覧を端までスクロール→全選択→最大の台帳を開いて端までスクロール（app/ui/js/e2e-auto.js）"
            memorySampling = "0.5秒ごと。aoalb2-app.exe とその子孫（msedgewebview2.exe を含む）の WorkingSet64・PrivateMemorySize64 の合計"
          } | ConvertTo-Json | Out-File -Encoding utf8 measure-windows\environment.json

      # 合格品：全工程が成功した時だけ。インストーラーがなければ失敗にする
      - name: 合格したインストーラーを保存
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aoalb2-windows-installer-passed
          retention-days: 7
          if-no-files-found: error
          path: |
            aoalb2-local/target/release/bundle/nsis/*.exe
            aoalb2-local/bench-windows.json
            aoalb2-local/node-tests.tap
            aoalb2-local/measure-windows/

      # 不合格時の診断用：インストーラーは含めない（不合格品を配布物と誤認しないため）
      - name: 失敗時の診断情報を保存（インストーラーなし）
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aoalb2-windows-diagnostics-FAILED
          retention-days: 7
          if-no-files-found: warn
          path: |
            aoalb2-local/bench-windows.json
            aoalb2-local/node-tests.tap
            aoalb2-local/measure-windows/
            aoalb2-local/target/release/bundle/nsis/*.log
