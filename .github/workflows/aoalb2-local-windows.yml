# aoALB 2 ローカル版：Windowsで自動検証し、インストーラー（未署名）を作る。
# このブランチへのpush時だけ動く。mainやGitHub Pagesには影響しない。
name: aoALB2 local - Windows build

on:
  push:
    branches: [feature/aoalb2-local]
    paths: ["aoalb2-local/**", ".github/workflows/aoalb2-local-windows.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: aoalb2-local
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: aoalb2-local
      - name: 中核の自動検証
        run: cargo test -p aoalb_core --release
      - name: 画面ロジックの自動検証
        run: node --test app/tests/ledger-model.test.mjs
      - name: 性能計測（1,000枚）
        run: cargo run --release -p aoalb_core --bin aoalb-bench -- 1000 bench-work > bench-1000-windows.json
      - name: Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: インストーラー作成
        working-directory: aoalb2-local/app/src-tauri
        run: cargo tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: aoalb2-windows
          path: |
            aoalb2-local/target/release/bundle/nsis/*.exe
            aoalb2-local/bench-1000-windows.json
