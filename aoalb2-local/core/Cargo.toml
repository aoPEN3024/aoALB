[package]
name = "aoalb_core"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
fs2 = "0.4.3"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
jpeg-decoder = "0.3.2"
kamadak-exif = "0.6.2"
rusqlite = { version = "0.43.0", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subsetter = "0.2.6"
thiserror = "2.0.21"
ttf-parser = "0.25.1"
uuid = { version = "1.29.3", features = ["v4", "v7"] }
zip = { version = "9.8.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
